<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
            <form>
                <label for="item">Item Name</label>
                <input type="text" name="item" id="item" placeholder="Enter item name here" required>

                <label for="price">Item Price</label>
                <input type="number" min="1" name="price" id="price" placeholder="Enter item price" required>

                <button type="submit">Add</button>
            </form>
        </section>

        <section id="market-list-container">
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
