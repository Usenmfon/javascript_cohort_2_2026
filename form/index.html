<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        form::before {
            content: "Course Registration";
            display: block;
            font-size: 26px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        form::after {
            content: "Fill in your details to register for a course.";
            display: block;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;
            color: #111827;
            background: #fff;

            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: 600;
            cursor: pointer;

            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 500px) {
            form {
                margin: 20px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <form>

        <label for="fullname">Fullname</label>
        <input 
            type="text" 
            name="fullname" 
            id="fullname"
            placeholder="Enter your full name"
            required
        >


        <label for="email">Email</label>
        <input 
            type="email" 
            name="email" 
            id="email"
            placeholder="Enter your email address"
            required
        >


        <label for="course">Course</label>
        <select name="course" id="course" required>
            <option value="">Select a course</option>
            <option value="javascript">JavaScript</option>
            <option value="data-analytics">Data Analytics</option>
            <option value="python">Python</option>
            <option value="web-design">Web Design</option>
            <option value="digital-marketing">Digital Marketing</option>
        </select>

        <button type="submit">Register</button>

    </form>

    <script src="app.js"></script>
</body>
</html>
